<!DOCTYPE html><html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101726"><title>Python Quest · Read Python for AI</title><style>
:root{color-scheme:dark;--bg:#0a1020;--panel:#141e31;--panel2:#1b2940;--line:#30405b;--txt:#eaf3ff;--muted:#aab9ce;--accent:#6ddbc0;--gold:#f7c66d;--red:#ff8c9c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -10%,#253a5d 0%,transparent 40%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--txt);line-height:1.5}button,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1280px;margin:auto;display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:26px 16px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}.logo{font-size:1.35rem;font-weight:900;letter-spacing:-.04em;display:flex;gap:10px;align-items:center}.small{font-size:.82rem;color:var(--muted)}.tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:30px;padding:4px 10px;color:var(--muted);font-size:.76rem;letter-spacing:.025em}.logo-emoji{background:#243b56;border-radius:14px;padding:10px}.sideitem{width:100%;text-align:left;display:flex;align-items:center;gap:11px;padding:11px 12px;margin:4px 0;border-radius:12px;background:transparent;color:var(--muted)}.sideitem:hover,.sideitem.active{background:#25364f;color:white}.sideitem.active{box-shadow:inset 3px 0 var(--accent)}.sideitem .number{font-size:.72rem;font-weight:800;background:#24364e;border-radius:7px;padding:5px}.sideitem .tick{margin-left:auto;color:var(--accent)}main{padding:32px clamp(18px,4vw,52px) 70px;min-width:0}.hero{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.hero h1{font-size:clamp(1.7rem,4vw,2.6rem);letter-spacing:-.045em;line-height:1.13;margin:8px 0}.hero p{margin:0;color:var(--muted)}.card{background:linear-gradient(160deg,#1a273e,#121d30);border:1px solid var(--line);border-radius:20px;padding:25px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:15px}.stat strong{font-size:1.5rem;display:block}.stat .small{font-size:.76rem}.worldgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.worldcard{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;padding:18px;background:#162238;cursor:pointer;text-align:left;color:var(--txt);transition:transform .15s,border-color .15s}.worldcard:hover{transform:translateY(-2px);border-color:#617c9b}.worldcard h3{margin:10px 0 3px}.worldcard p{color:var(--muted);font-size:.85rem;margin:0 0 13px}.worldcard .worldicon{font-size:2rem}.progress{height:7px;background:#30425d;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--accent);transition:width .2s}.btn{padding:10px 15px;border-radius:11px;font-weight:700;background:#2b3e59;color:white;border:1px solid #425675;display:inline-flex;gap:8px;align-items:center;justify-content:center}.btn.primary{background:var(--accent);color:#092220;border-color:transparent}.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.45;cursor:not-allowed}.btnbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.mode-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 22px}.mode-tabs button{border:1px solid var(--line);background:#1c2b42;color:var(--muted);border-radius:10px;padding:9px 14px}.mode-tabs button.active{background:#31586b;color:white;border-color:#6096a7}.lesson-stack{display:grid;gap:12px}.lesson-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.lesson-body p{color:var(--muted);margin:10px 0 13px}.code{white-space:pre-wrap;overflow-wrap:anywhere;background:#090f1c;border:1px solid #30405a;border-radius:13px;padding:16px;overflow:auto;color:#c2f1e0;font:14px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4}.note{padding:12px 15px;border-left:3px solid var(--accent);background:#183241;border-radius:0 10px 10px 0;color:#c9e9e3;font-size:.9rem}.qbox{border:1px solid var(--line);padding:19px;border-radius:16px;background:#162238;margin-bottom:14px}.qbox h3{margin:7px 0 13px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{border:1px solid #40516a;padding:12px 14px;background:#1b2a42;border-radius:10px;color:var(--txt);text-align:left;min-height:50px}.choice:hover:not(:disabled){border-color:var(--accent)}.choice.chosen{border-color:#8ab4ff;background:#304563}.choice.right{border-color:var(--accent);background:#19473e}.choice.wrong{border-color:var(--red);background:#512d3a}.choice:disabled{cursor:default}.feedback{padding:13px;margin-top:12px;border-radius:10px;background:#23344d;color:#e9f2ff}.feedback.good{background:#174138}.feedback.bad{background:#4a2a3c}.badge{border-radius:7px;padding:4px 9px;font-size:.75rem;font-weight:700;background:#314057;color:#d6e4f1}.editor{width:100%;min-height:200px;resize:vertical;background:#080f1c;color:#bff2df;border:1px solid #455672;border-radius:13px;padding:15px;font:14px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4;outline:none}.editor:focus{border-color:var(--accent)}.output{min-height:75px;background:#080e19;color:#e5f4fb;border:1px solid #344862;border-radius:12px;padding:14px;white-space:pre-wrap;font:13px/1.55 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:22px;right:22px;background:#234c43;border:1px solid #61c6ab;color:white;padding:12px 17px;border-radius:12px;box-shadow:0 12px 35px #0008;z-index:100}.screenreader{position:absolute;left:-9999px}.mobile-header{display:none}.warning{background:#332a2a;border:1px solid #71524d;padding:10px 14px;border-radius:11px;font-size:.83rem;color:#ecd2c1;margin:12px 0}.checkpoint{font-size:.85rem;color:var(--muted);padding:8px 0}.heroaccent{font-size:3rem}.kbd{display:inline-block;padding:2px 6px;border-radius:5px;border:1px solid #55657a;background:#1c2b42;font-family:monospace}.sectionTitle{font-size:1.12rem;margin:25px 0 14px}.intro{font-size:1rem;color:var(--muted)}@media(max-width:920px){.app{grid-template-columns:1fr}.sidebar{display:none}.sidebar.show{display:block;position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.mobile-header{display:flex;align-items:center;justify-content:space-between;padding:12px 17px;border-bottom:1px solid var(--line)}main{padding:22px 17px 60px}.hero{margin-top:8px}}@media(max-width:650px){.stats,.worldgrid,.split{grid-template-columns:1fr 1fr}.choices{grid-template-columns:1fr}.card{padding:17px}.worldcard{padding:15px}.stat{padding:12px}.split{grid-template-columns:1fr}.heroaccent{display:none}}@media(max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}.worldgrid{grid-template-columns:1fr}}
.world-actions{margin:20px 0}.world-actions [aria-pressed=true]{border-color:var(--accent)}.choices{grid-template-columns:1fr}.concepts{display:grid;gap:14px}.concepts .card{margin:0}.concepts h2{margin-top:0}.intro{max-width:68ch}.feedback p{margin:6px 0 0}.worldcard small{color:var(--muted)}.reading-count{margin:0;color:var(--muted)}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}section[tabindex="-1"]:focus,h1[tabindex="-1"]:focus{outline:none}
</style></head><body>
